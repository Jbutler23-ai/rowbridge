[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "rowbridge"
version = "0.1.0"
description = "Offline CSV validation and reconciliation with explicit types and keys"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
rowbridge = "rowbridge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["rowbridge*"]
